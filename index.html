<!DOCTYPE html>
<html lang="es">
<head>

  <title>SGD - Iniciar Sesión</title>
  <link rel="stylesheet" href="/output.css" />
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div id="root"></div>

  <!-- Contenedor para Firma Perú -->

  <!-- Elemento requerido por el script de Firma Perú para adjuntar el iframe -->

  <!-- jQuery 3.6.0 para Firma Perú -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
    onload="window.jqFirmaPeru=jQuery.noConflict(false)"></script>

  <!-- Firma Perú Cliente Web -->
  <script src="https://apps.firmaperu.gob.pe/web/clienteweb/firmaperu.min.js"
    defer></script>

  <!-- Vite entrypoint -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
